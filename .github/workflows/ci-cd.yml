name: AkMoney Frontend CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Checks
        run: npm test

      - name: Build Production Frontend
        run: npm run build

  build-and-publish:
    name: Build & Publish Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'akintoyesodeinde' }}/akmoney-frontend
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2 via SSM
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS via IAM OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/AkMoneyGitHubDeployRole
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Execute Deployment via AWS SSM Run Command
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME || 'akintoyesodeinde' }}/akmoney-frontend:${{ github.sha }}"
          echo "Triggering SSM Run Command for AkMoney Frontend deployment: $IMAGE_TAG"
          
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Application,Values=AkMoney" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/akmoney && ./deploy-release.sh frontend $IMAGE_TAG false\"]" \
            --output text \
            --query "Command.CommandId")
          
          echo "SSM Command dispatched: $COMMAND_ID. Waiting for execution result..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id $(aws ec2 describe-instances --filters "Name=tag:Application,Values=AkMoney" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Frontend deployment command completed successfully."
