name: AkMoney Frontend CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: akmoney-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  EXPECTED_AWS_ACCOUNT_ID: '415805875879'
  FRONTEND_OIDC_ROLE_ARN: 'arn:aws:iam::415805875879:role/akmoney-frontend-github-deploy-role'

jobs:
  validate:
    name: Validate, Lint, TypeCheck & Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Exposed Secrets or Production Env Files
        run: |
          if git ls-files --error-unmatch .env .env.local .env.production >/dev/null 2>&1; then
            echo "CRITICAL: Environment file is tracked in Git!" >&2
            exit 1
          fi
          if grep -RInE "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" src; then
            echo "CRITICAL: Hardcoded secret detected in frontend source!" >&2
            exit 1
          fi

      - name: Setup Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Reproducible Dependency Installation
        run: npm ci

      - name: Execute TypeScript & Lint Checks
        run: npm test

      - name: Verify Production Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Production Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: akmoney-frontend:ci-validate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Publish to Docker Hub & Deploy to AWS EC2 via SSM
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via Frontend IAM OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.FRONTEND_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify Target AWS Account ID (415805875879)
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Authenticated to AWS Account: $ACTUAL_ACCOUNT"
          if [ "$ACTUAL_ACCOUNT" != "${{ env.EXPECTED_AWS_ACCOUNT_ID }}" ]; then
            echo "CRITICAL: AWS Account mismatch! Expected ${{ env.EXPECTED_AWS_ACCOUNT_ID }}, got $ACTUAL_ACCOUNT." >&2
            exit 1
          fi

      - name: Retrieve Frontend Docker Hub Credentials from AWS SSM Parameter Store
        id: ssm-creds
        run: |
          DOCKER_USER=$(aws ssm get-parameter --name "/akmoney/ci/frontend/dockerhub-username" --with-decryption --query "Parameter.Value" --output text)
          DOCKER_TOKEN=$(aws ssm get-parameter --name "/akmoney/ci/frontend/dockerhub-token" --with-decryption --query "Parameter.Value" --output text)
          echo "::add-mask::${DOCKER_TOKEN}"
          echo "docker_user=${DOCKER_USER}" >> "$GITHUB_OUTPUT"
          echo "docker_token=${DOCKER_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.ssm-creds.outputs.docker_user }}
          password: ${{ steps.ssm-creds.outputs.docker_token }}

      - name: Build and Push Immutable Frontend Image to Docker Hub
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ steps.ssm-creds.outputs.docker_user }}/akmoney-frontend:${{ github.sha }}
            ${{ steps.ssm-creds.outputs.docker_user }}/akmoney-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record Published Image Digest
        run: |
          echo "Published Image: ${{ steps.ssm-creds.outputs.docker_user }}/akmoney-frontend:${{ github.sha }}"
          echo "Image Digest: ${{ steps.build-image.outputs.digest }}"

      - name: Trigger Restricted Frontend Deployment SSM Document (AkMoney-Deploy-Frontend)
        id: ssm-deploy
        run: |
          IMAGE_TAG="${{ steps.ssm-creds.outputs.docker_user }}/akmoney-frontend:${{ github.sha }}"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=akmoney-prod-server" "Name=tag:Project,Values=AkMoney" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: No running AkMoney production EC2 instance found." >&2
            exit 1
          fi

          echo "Dispatching SSM Document AkMoney-Deploy-Frontend to $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AkMoney-Deploy-Frontend" \
            --parameters "ImageTag=[\"$IMAGE_TAG\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Waiting for SSM Run Command ($COMMAND_ID) completion..."

          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; then
            echo "ERROR: Frontend SSM deployment failed!" >&2
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "[StandardOutputContent,StandardErrorContent]" --output text || true
            exit 1
          fi

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "Deployed Frontend Version: $IMAGE_TAG (${{ steps.build-image.outputs.digest }})"

      - name: Trigger Automated Rollback on Deployment Failure
        if: failure() && steps.ssm-deploy.outputs.instance_id != ''
        run: |
          echo "Initiating AkMoney-Rollback-Frontend via AWS SSM..."
          ROLLBACK_CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ssm-deploy.outputs.instance_id }}" \
            --document-name "AkMoney-Rollback-Frontend" \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed --command-id "$ROLLBACK_CMD_ID" --instance-id "${{ steps.ssm-deploy.outputs.instance_id }}" || true
          aws ssm get-command-invocation --command-id "$ROLLBACK_CMD_ID" --instance-id "${{ steps.ssm-deploy.outputs.instance_id }}" --query "StandardOutputContent" --output text || true
